name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            function_app/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest
      - name: Validate config file
        run: python -c "import sys; sys.path.insert(0, 'function_app'); from shared.config import Settings; print(Settings.load(env={}))"
