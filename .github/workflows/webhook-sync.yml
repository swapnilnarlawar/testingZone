name: Webhook Sync

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC: adds the webhook to repos newly created in the watched groups
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC token for the UAMI login
  contents: read

concurrency:
  group: webhook-ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KEYVAULT_URL: ${{ vars.KEYVAULT_URL }}
      WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ops
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Webhook Sync
        run: python scripts/webhooks.py setup
